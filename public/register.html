<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEN OPTİK - Kayıt</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    }
    .register-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
    .register-card {
      background: var(--bg-primary, #ffffff);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .register-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid var(--accent, #60a5fa);
    }
    .register-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
    .register-subtitle {
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-primary);
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--border, #e2e8f0);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-secondary, #f8fafc);
      color: var(--text-primary);
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent, #60a5fa);
    }
    .btn-register {
      width: 100%;
      padding: 14px;
      background: var(--success, #22c55e);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-register:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .register-footer {
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .register-footer a {
      color: var(--accent, #60a5fa);
      text-decoration: none;
      font-weight: 600;
    }
    .register-footer a:hover {
      text-decoration: underline;
    }
    .error-message {
      background: #fee2e2;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      display: none;
    }
    .brand-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-card">
      <div class="brand-icon">👓</div>
      <h1 class="register-title">OEN OPTİK</h1>
      <p class="register-subtitle">Yeni Hesap Oluştur</p>

      <div id="errorMessage" class="error-message"></div>

      <form id="registerForm" onsubmit="return handleRegister(event)">
        <div class="form-group">
          <label for="fullname">Ad Soyad</label>
          <input type="text" id="fullname" name="fullname" required placeholder="Adınız ve soyadınız">
        </div>
        <div class="form-group">
          <label for="username">Kullanıcı Adı</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="Bir kullanıcı adı seçin">
        </div>
        <div class="form-group">
          <label for="password">Şifre</label>
          <input type="password" id="password" name="password" required minlength="4" autocomplete="new-password" placeholder="En az 4 karakter">
        </div>
        <div class="form-group">
          <label for="passwordConfirm">Şifre Tekrar</label>
          <input type="password" id="passwordConfirm" name="passwordConfirm" required autocomplete="new-password" placeholder="Şifrenizi tekrar girin">
        </div>
        <button type="submit" class="btn-register" id="registerBtn">Kayıt Ol</button>
      </form>

      <div class="register-footer">
        Zaten hesabınız var mı? <a href="/login.html">Giriş Yap</a>
      </div>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    fetch('/api/auth/durum').then(r => r.json()).then(data => {
      if (data.loggedIn) window.location.href = '/index.html';
    });

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      const errorDiv = document.getElementById('errorMessage');
      const fullname = document.getElementById('fullname').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('passwordConfirm').value;

      if (!fullname || !username || !password) {
        errorDiv.textContent = 'Tüm alanları doldurun';
        errorDiv.style.display = 'block';
        return false;
      }

      if (password !== passwordConfirm) {
        errorDiv.textContent = 'Şifreler eşleşmiyor';
        errorDiv.style.display = 'block';
        return false;
      }

      if (password.length < 4) {
        errorDiv.textContent = 'Şifre en az 4 karakter olmalı';
        errorDiv.style.display = 'block';
        return false;
      }

      btn.textContent = 'Kayıt yapılıyor...';
      btn.disabled = true;
      errorDiv.style.display = 'none';

      try {
        const response = await fetch('/api/auth/kayit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, fullname })
        });

        const data = await response.json();

        if (data.success) {
          window.location.href = '/index.html';
        } else {
          errorDiv.textContent = data.message || 'Kayıt başarısız';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'Bağlantı hatası: ' + err.message;
        errorDiv.style.display = 'block';
      }

      btn.textContent = 'Kayıt Ol';
      btn.disabled = false;
      return false;
    }
  </script>
</body>
</html>
