<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEN OPTİK - Kasa</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <img src="assets/oen.jpg" alt="OEN OPTİK" class="logo">
      <div class="brand">
        <span class="brand-name">OEN OPTİK</span>
        <span class="brand-sub">Eyewear</span>
      </div>
    </div>
    <div class="header-right">
      <nav class="nav">
        <button class="nav-btn" onclick="navigate('index.html')">📋 Sipariş Kaydı</button>
        <button class="nav-btn" onclick="navigate('list.html')">📑 Sipariş Listesi</button>
        <button class="nav-btn" onclick="navigate('admin.html')">🏷️ Ürün Yönetimi</button>
        <button class="nav-btn active" onclick="navigate('kasa.html')">💰 Kasa</button>
        <button class="nav-btn" onclick="openBackupModal()">💾 Yedekler</button>
        <button class="nav-btn" onclick="location.reload()" title="Sayfayı Yenile">🔄</button>
      </nav>
      <button class="theme-toggle" onclick="toggleTheme()" title="Tema Değiştir"></button>
    </div>
  </header>

  <main class="container">
    <!-- Hızlı Özet -->
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px;">
      <div class="card" style="text-align: center; border-left: 4px solid var(--accent);">
        <div style="color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 4px;">Bugünkü Ciro</div>
        <div id="gunlukCiro" style="font-size: 1.5rem; font-weight: 700; color: var(--accent);">₺0.00</div>
      </div>
      <div class="card" style="text-align: center; border-left: 4px solid var(--success);">
        <div style="color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 4px;">Bu Hafta</div>
        <div id="haftalikCiro" style="font-size: 1.5rem; font-weight: 700; color: var(--success);">₺0.00</div>
      </div>
      <div class="card" style="text-align: center; border-left: 4px solid var(--warning);">
        <div style="color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 4px;">Bu Ay</div>
        <div id="aylikCiro" style="font-size: 1.5rem; font-weight: 700; color: var(--warning);">₺0.00</div>
      </div>
      <div class="card" style="text-align: center; border-left: 4px solid var(--info);">
        <div style="color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 4px;">Toplam Ciro</div>
        <div id="toplamCiro" style="font-size: 1.5rem; font-weight: 700; color: var(--info);">₺0.00</div>
      </div>
    </div>

    <!-- Tarih Filtresi -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">📅 Tarih Aralığı Filtresi</h2>
      </div>
      <div class="search-panel">
        <div class="form-group">
          <label>Başlangıç</label>
          <input type="date" id="kasaTarihBaslangic">
        </div>
        <div class="form-group">
          <label>Bitiş</label>
          <input type="date" id="kasaTarihBitis">
        </div>
        <div class="form-group">
          <label>&nbsp;</label>
          <div class="btn-group">
            <button class="btn btn-primary btn-sm" onclick="filtrele()">🔍 Filtrele</button>
            <button class="btn btn-outline btn-sm" onclick="filtreTemizle()">✕ Temizle</button>
            <button class="btn btn-outline btn-sm" onclick="excelAktar()">📊 Excel'e Aktar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Ödeme Tipi Dağılımı -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">💳 Ödeme Tipi Dağılımı</h2>
      </div>
      <div id="odemeDagitimi" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;"></div>
    </div>

    <!-- Sipariş Listesi -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">📋 Siparişler</h2>
        <div id="kasaToplam" style="font-weight: 600; color: var(--accent);"></div>
      </div>
      <div class="table-container" style="max-height: 500px; overflow-y: auto;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Sıra No</th>
              <th>Adı Soyadı</th>
              <th>Telefon</th>
              <th>Sipariş Tarihi</th>
              <th>Ödeme Tipi</th>
              <th>Toplam</th>
              <th>Alınan</th>
              <th>Kalan</th>
            </tr>
          </thead>
          <tbody id="kasaTableBody"></tbody>
        </table>
        <div id="kasaEmptyState" class="empty-state" style="display: none;">
          <div class="empty-state-icon">💰</div>
          <div class="empty-state-text">Bu tarihte sipariş bulunmuyor.</div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <div id="backupModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">💾 Yedek Yönetimi</h3>
        <button class="modal-close" onclick="closeBackupModal()">&times;</button>
      </div>
      <div class="btn-group" style="margin-bottom: 16px;">
        <button class="btn btn-primary btn-sm" onclick="createBackup()">+ Yeni Yedek Al</button>
        <button class="btn btn-outline btn-sm" onclick="openBackupFolder()">📁 Klasörü Aç</button>
      </div>
      <div id="backupList" class="table-container"></div>
    </div>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/kasa.js"></script>
</body>
</html>
