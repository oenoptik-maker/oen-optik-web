<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEN OPTİK - Giriş</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
    .login-card {
      background: var(--bg-primary, #ffffff);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .login-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid var(--accent, #60a5fa);
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
    .login-subtitle {
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-primary);
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--border, #e2e8f0);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-secondary, #f8fafc);
      color: var(--text-primary);
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent, #60a5fa);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--accent, #60a5fa);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-login:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .login-footer {
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .login-footer a {
      color: var(--accent, #60a5fa);
      text-decoration: none;
      font-weight: 600;
    }
    .login-footer a:hover {
      text-decoration: underline;
    }
    .error-message {
      background: #fee2e2;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      display: none;
    }
    .brand-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand-icon">👓</div>
      <h1 class="login-title">OEN OPTİK</h1>
      <p class="login-subtitle">Sipariş Kayıt Sistemi</p>

      <div id="errorMessage" class="error-message" style="display:none;"></div>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label for="username">Kullanıcı Adı</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="Kullanıcı adınızı girin">
        </div>
        <div class="form-group">
          <label for="password">Şifre</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Şifrenizi girin">
        </div>
        <button type="submit" class="btn-login" id="loginBtn">Giriş Yap</button>
      </form>

      <div class="login-footer">
        Hesabınız yok mu? <a href="/register.html">Kayıt Ol</a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var token = localStorage.getItem('oken_token');
      var headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      fetch('/api/auth/durum', { headers: headers }).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function(data) {
        if (data.loggedIn) window.location.href = '/index.html';
      }).catch(function() {});
    })();

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorDiv = document.getElementById('errorMessage');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errorDiv.textContent = 'Kullanıcı adı ve şifre gerekli';
        errorDiv.style.display = 'block';
        return false;
      }

      btn.textContent = 'Giriş yapılıyor...';
      btn.disabled = true;
      errorDiv.style.display = 'none';

      try {
        const response = await fetch('/api/auth/giris', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          if (data.token) localStorage.setItem('oken_token', data.token);
          window.location.href = '/index.html';
        } else {
          errorDiv.textContent = data.message || 'Giriş başarısız';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'Bağlantı hatası: ' + err.message;
        errorDiv.style.display = 'block';
      }

      btn.textContent = 'Giriş Yap';
      btn.disabled = false;
      return false;
    }
  </script>
</body>
</html>
