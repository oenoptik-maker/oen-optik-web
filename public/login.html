<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>OEN OPTİK - Giriş</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      margin: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
    .login-card {
      background: var(--bg-primary, #ffffff);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .login-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid var(--accent, #60a5fa);
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
    .login-subtitle {
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-primary);
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--border, #e2e8f0);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-secondary, #f8fafc);
      color: var(--text-primary);
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent, #60a5fa);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--accent, #60a5fa);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-login:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .login-footer {
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .login-footer a {
      color: var(--accent, #60a5fa);
      text-decoration: none;
      font-weight: 600;
    }
    .login-footer a:hover {
      text-decoration: underline;
    }
    .error-message {
      background: #fee2e2;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      display: none;
    }
    .brand-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand-icon">👓</div>
      <h1 class="login-title">OEN OPTİK</h1>
      <p class="login-subtitle">Sipariş Kayıt Sistemi</p>

      <div id="errorMessage" class="error-message" style="display:none;"></div>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div id="step1">
          <div class="form-group">
            <label for="username">Kullanıcı Adı</label>
            <input type="text" id="username" name="username" required autocomplete="username" placeholder="Kullanıcı adınızı girin">
          </div>
          <div class="form-group">
            <label for="password">Şifre</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Şifrenizi girin" oncontextmenu="return false">
          </div>
          <button type="submit" class="btn-login" id="loginBtn">Giriş Yap</button>
        </div>
        
        <div id="step2" style="display:none;">
          <div class="sms-info" style="background:#e0f2fe; padding:12px; border-radius:8px; margin-bottom:16px; font-size:0.85rem; color:#0369a1;">
            📱 Telefonunuza 6 haneli kod gönderildi
          </div>
          <div class="form-group">
            <label for="smsCode">Doğrulama Kodu</label>
            <input type="text" id="smsCode" name="smsCode" required maxlength="6" pattern="[0-9]{6}" placeholder="6 haneli kodu girin" style="text-align:center; font-size:1.5rem; letter-spacing:8px;">
          </div>
          <button type="submit" class="btn-login" id="verifyBtn">Doğrula ve Giriş Yap</button>
          <button type="button" class="btn-login" id="backBtn" style="background:#6b7280; margin-top:8px;">← Geri Dön</button>
          <div id="testCode" style="display:none; background:#fef3c7; padding:12px; border-radius:8px; margin-top:12px; font-size:0.85rem; color:#92400e;"></div>
        </div>
      </form>

      <div class="login-footer">
        Şifrenizi mi unuttunuz? Yöneticinize başvurun.
      </div>
    </div>
  </div>

  <script>
    // Sifre koruma: type degisikligini engelle
    (function() {
      var pwd = document.getElementById('password');
      if (!pwd) return;
      var orijinalDeger = '';
      pwd.addEventListener('input', function() { orijinalDeger = this.value; });
      var gozlemci = new MutationObserver(function() {
        if (pwd.type !== 'password') { pwd.type = 'password'; pwd.value = orijinalDeger; }
      });
      gozlemci.observe(pwd, { attributes: true, attributeFilter: ['type'] });
      Object.defineProperty(pwd, 'type', {
        get: function() { return 'password'; },
        set: function(v) { /* type degisikligi engellendi */ }
      });
      document.addEventListener('contextmenu', function(e) {
        if (e.target === pwd || e.target.closest('#password')) { e.preventDefault(); return false; }
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c'))) {
          if (document.activeElement === pwd) { e.preventDefault(); return false; }
        }
      });
    })();

    (function() {
      if (window.self !== window.top) {
        document.documentElement.classList.add('in-iframe');
        document.body.classList.add('in-iframe');
        document.documentElement.classList.add('login-page');
        document.body.classList.add('login-page');
      }
      var token = localStorage.getItem('oken_token');
      if (!token) return;
      // Token'i dogrula, gecerliyse yonlendir
      fetch('/api/auth/durum', {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.loggedIn) {
          window.location.href = '/index.html?token=' + encodeURIComponent(token);
        } else {
          // Token gecersiz, temizle
          try { localStorage.removeItem('oken_token'); } catch(e) {}
        }
      }).catch(function() {
        // Hata olursa da temizle, kullanici giris yapsin
        try { localStorage.removeItem('oken_token'); } catch(e) {}
      });
    })();

    async function handleLogin(e) {
      e.preventDefault();
      const errorDiv = document.getElementById('errorMessage');
      
      // Step 2: SMS kodu dogrulama
      if (document.getElementById('step2').style.display !== 'none') {
        return verifyCode(e);
      }
      
      // Step 1: Kullanici adi ve sifre
      const btn = document.getElementById('loginBtn');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errorDiv.textContent = 'Kullanıcı adı ve şifre gerekli';
        errorDiv.style.display = 'block';
        return false;
      }

      btn.textContent = 'Kontrol ediliyor...';
      btn.disabled = true;
      errorDiv.style.display = 'none';

      try {
        const fingerprint = generateFingerprint();
        const response = await fetch('/api/auth/gonder-kod', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, device_fingerprint: fingerprint })
        });

        const data = await response.json();

        if (data.success) {
          if (data.sms_required) {
            // SMS kodu gerekli - step 2'yi goster
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            document.getElementById('smsCode').focus();
            
            if (data.test_mode && data.message) {
              const testDiv = document.getElementById('testCode');
              testDiv.textContent = '🧪 ' + data.message;
              testDiv.style.display = 'block';
            }
          } else {
            // Guvenilir cihaz - direkt giris
            if (data.token) localStorage.setItem('oken_token', data.token);
            window.location.href = '/index.html' + (data.token ? '?token=' + encodeURIComponent(data.token) : '');
          }
        } else {
          errorDiv.textContent = data.message || 'Giriş başarısız';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'Bağlantı hatası: ' + err.message;
        errorDiv.style.display = 'block';
      }

      btn.textContent = 'Giriş Yap';
      btn.disabled = false;
      return false;
    }

    async function verifyCode(e) {
      e.preventDefault();
      const btn = document.getElementById('verifyBtn');
      const errorDiv = document.getElementById('errorMessage');
      const username = document.getElementById('username').value.trim();
      const code = document.getElementById('smsCode').value.trim();

      if (!code || code.length !== 6) {
        errorDiv.textContent = '6 haneli kodu girin';
        errorDiv.style.display = 'block';
        return false;
      }

      btn.textContent = 'Doğrulanıyor...';
      btn.disabled = true;
      errorDiv.style.display = 'none';

      try {
        const fingerprint = generateFingerprint();
        const response = await fetch('/api/auth/dogrula-kod', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, code, device_fingerprint: fingerprint, device_name: getDeviceName() })
        });

        const data = await response.json();

        if (data.success) {
          if (data.token) localStorage.setItem('oken_token', data.token);
          window.location.href = '/index.html' + (data.token ? '?token=' + encodeURIComponent(data.token) : '');
        } else {
          errorDiv.textContent = data.message || 'Doğrulama başarısız';
          errorDiv.style.display = 'block';
          document.getElementById('smsCode').value = '';
          document.getElementById('smsCode').focus();
        }
      } catch (err) {
        errorDiv.textContent = 'Bağlantı hatası: ' + err.message;
        errorDiv.style.display = 'block';
      }

      btn.textContent = 'Doğrula ve Giriş Yap';
      btn.disabled = false;
      return false;
    }

    function generateFingerprint() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillText('OEN Optik', 2, 2);
      
      const data = [
        navigator.userAgent,
        navigator.language,
        screen.width + 'x' + screen.height,
        screen.colorDepth,
        new Date().getTimezoneOffset(),
        canvas.toDataURL()
      ].join('|');
      
      let hash = 0;
      for (let i = 0; i < data.length; i++) {
        const char = data.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      return 'fp_' + Math.abs(hash).toString(36);
    }

    function getDeviceName() {
      const ua = navigator.userAgent;
      if (/android/i.test(ua)) return 'Android Cihaz';
      if (/iPad|iPhone|iPod/.test(ua)) return 'iOS Cihaz';
      if (/Windows/.test(ua)) return 'Windows PC';
      if (/Mac/.test(ua)) return 'Mac';
      if (/Linux/.test(ua)) return 'Linux';
      return 'Bilinmeyen Cihaz';
    }

    // Back button
    document.getElementById('backBtn').addEventListener('click', function() {
      document.getElementById('step1').style.display = 'block';
      document.getElementById('step2').style.display = 'none';
      document.getElementById('smsCode').value = '';
      document.getElementById('testCode').style.display = 'none';
    });
  </script>
</body>
</html>
