<!-- Google Sites'a eklenecek kod -->
<!-- "Yönetici" sayfasını düzenleyin, "Embed" > "Embed code" seçin, şu kodu yapıştırın -->

<style>
  .oen-embed-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 0;
    height: calc(100vh - 80px);
    min-height: 500px;
  }
  .oen-embed-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 8px;
  }
</style>
<div class="oen-embed-wrapper">
  <iframe 
    src="https://oen-optik-web.vercel.app" 
    allow="clipboard-write"
    loading="lazy">
  </iframe>
</div>

<!-- 
NOT: Deploy sonrası URL'i güncelleyin:
https://oen-optik-web.vercel.app → kendi Vercel URL'iniz olacak

Google Sites'ta:
1. "Yönetici" sayfasına gidin
2. Sağ panelden "Embed" > "Embed code" seçin
3. Yukarıdaki <style> ve <div> kodlarını yapıştırın
4. "Next" > "Insert" ile ekleyin
-->
